<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>Günlük</title>
    <meta
      name="description"
      content="Uçtan uca şifreli kişisel günlük. Hesap yok, sunucu yok — yazdıkların cihazından çıkmaz."
    />

    <!--
      Content-Security-Policy meta etiketi olarak da gömülür. Böylece
      GitHub Pages gibi özel HTTP başlığı eklenemeyen barındırma
      hizmetlerinde de koruma çalışır. Değer .env.production /
      .env.development dosyalarından gelir.
    -->
    <meta http-equiv="Content-Security-Policy" content="%REACT_APP_CSP%" />

    <meta name="theme-color" content="#faf7f0" />
    <meta name="color-scheme" content="light dark" />

    <!-- Gizlilik -->
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex, nofollow" />

    <!--
      Simgeler scripts/make-icons.js ile üretilir. SVG'yi destekleyen
      tarayıcılar onu tercih eder (her ölçekte keskin); .ico eski
      tarayıcılar için yedektir.
    -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="any" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!--
      Tek dış istek: yazı tipleri. Günlük içeriği hiçbir koşulda dışarı
      gitmez. Bu isteği de istemiyorsan README'deki "yazı tiplerini
      yerelleştirme" bölümüne bak.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>

  <body>
    <noscript>
      <div style="max-width: 460px; margin: 14vh auto; padding: 2rem; font-family: Georgia, serif; text-align: center; color: #1a1613;">
        <h1 style="font-size: 1.4rem; font-weight: 400; letter-spacing: 0.12em; text-transform: uppercase;">
          Günlük
        </h1>
        <hr style="width: 40px; border: 0; border-top: 2px solid #1a1613; margin: 1.5rem auto;" />
        <p style="color: #5c554c; line-height: 1.6;">
          Günlükler tarayıcıda şifrelenip çözüldüğü için bu uygulama
          JavaScript olmadan çalışamaz. Tarayıcı ayarlarından etkinleştirin.
        </p>
      </div>
    </noscript>

    <div id="root"></div>
  </body>
</html>
